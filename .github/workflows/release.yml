name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure update manifest
        if: vars.UPDATE_MANIFEST_URL != ''
        shell: pwsh
        run: |
          @{ manifest_url = "${{ vars.UPDATE_MANIFEST_URL }}" } |
            ConvertTo-Json |
            Set-Content resources/update.json -Encoding utf8

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version v$version"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          uv venv
          uv pip install -e "backend[dev]"

      - name: Backend checks
        run: |
          .venv\Scripts\python.exe -m ruff check backend
          .venv\Scripts\python.exe -m pytest backend

      - name: Frontend checks
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build renderer and Electron bundles
        run: npm run build

      - name: Build Python sidecar
        env:
          PRICE_MONITOR_PYTHON: ${{ github.workspace }}\.venv\Scripts\python.exe
        run: node scripts/build-backend.mjs

      - name: Build NSIS installer
        run: npx electron-builder --win nsis --publish never

      - name: Generate SHA256
        shell: pwsh
        run: |
          Get-ChildItem release\*.exe | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)" | Tee-Object -Append release\SHA256SUMS.txt
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PriceMonitor-windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
