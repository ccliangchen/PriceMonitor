name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          uv venv
          uv pip install -e "backend[dev]"

      - name: Backend lint
        run: .venv\Scripts\python.exe -m ruff check backend

      - name: Backend tests
        run: .venv\Scripts\python.exe -m pytest backend

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Build renderer and Electron bundles
        run: npm run build
