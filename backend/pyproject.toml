[project]
name = "price-monitor-backend"
version = "0.1.14"
description = "PriceMonitor desktop backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.14.2",
  "pydantic-settings>=2.12.0",
  "sqlalchemy>=2.1.6",
  "alembic>=1.20.1",
  "apscheduler>=3.11.3",
  "playwright>=1.64.1",
  "beautifulsoup4>=4.15.0",
  "lxml>=6.1.3",
  "httpx>=0.28.1",
  "tenacity>=9.2.1",
  "keyring>=25.7.0",
  "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1",
  "respx>=0.23.1",
  "ruff>=0.17.3",
  "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
