appId: com.pricemonitor.app
productName: PriceMonitor
artifactName: PriceMonitor-${version}-setup.${ext}
directories:
  buildResources: build
  output: release
electronDist: node_modules/electron/dist
files:
  - out/**/*
  - resources/**/*
  - package.json
extraResources:
  - from: backend/dist/price-monitor-backend
    to: backend
compression: normal
win:
  target:
    - nsis
  icon: resources/icon.ico
  executableName: PriceMonitor
nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PriceMonitor
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  deleteAppDataOnUninstall: false
